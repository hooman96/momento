name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/email-submission-backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/email-submission-backend/**'

jobs:
  backend:
    name: Lint, Test, Docker Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/email-submission-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'
          cache: 'npm'
          cache-dependency-path: src/email-submission-backend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
  
      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present -- --watchAll=false --passWithNoTests

      - name: Build Docker image
        run: docker build -t email-submission-backend .
      